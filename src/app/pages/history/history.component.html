<div class="page-container">
  <h1 class="page-title">Historial de búsquedas</h1>

  @if (loading()) {
    <div class="loading-container"><mat-spinner diameter="40"></mat-spinner></div>
  } @else if (!history().length) {
    <div class="empty-state">
      <mat-icon>history</mat-icon>
      <p>No hay búsquedas registradas</p>
    </div>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="history()">
        <ng-container matColumnDef="query">
          <th mat-header-cell *matHeaderCellDef>Búsqueda</th>
          <td mat-cell *matCellDef="let row">{{ row.query }}</td>
        </ng-container>

        <ng-container matColumnDef="results">
          <th mat-header-cell *matHeaderCellDef>Resultados</th>
          <td mat-cell *matCellDef="let row">{{ row.results_count }}</td>
        </ng-container>

        <ng-container matColumnDef="source">
          <th mat-header-cell *matHeaderCellDef>Origen</th>
          <td mat-cell *matCellDef="let row">{{ row.source }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let row">{{ row.created_at | date:'short' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>

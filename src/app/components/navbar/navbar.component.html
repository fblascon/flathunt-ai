<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/" fill="clear">
        <ion-icon slot="start" [name]="getIcon('apartment')"></ion-icon>
        <ion-label>FlatHunt AI</ion-label>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      @if (isAuth) {
        <ion-button routerLink="/listings" routerLinkActive="active" fill="clear">
          <ion-icon slot="icon-only" [name]="getIcon('search')"></ion-icon>
        </ion-button>
        <ion-button routerLink="/preferences" routerLinkActive="active" fill="clear">
          <ion-icon slot="icon-only" [name]="getIcon('tune')"></ion-icon>
        </ion-button>
        <ion-button routerLink="/favorites" routerLinkActive="active" fill="clear">
          <ion-icon slot="icon-only" [name]="getIcon('favorite')"></ion-icon>
        </ion-button>
        <ion-button routerLink="/history" routerLinkActive="active" fill="clear">
          <ion-icon slot="icon-only" [name]="getIcon('history')"></ion-icon>
        </ion-button>

        <ion-button (click)="signOut()" fill="clear">
          <ion-icon slot="icon-only" [name]="getIcon('logout')"></ion-icon>
        </ion-button>
      } @else {
        <ion-button (click)="signIn()" fill="solid" color="primary">
          <ion-icon slot="start" [name]="getIcon('login')"></ion-icon>
          <ion-label>Iniciar sesión</ion-label>
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

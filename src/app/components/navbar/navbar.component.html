<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/" fill="clear">
        <mat-icon slot="start" fontIcon="apartment"></mat-icon>
        <ion-label>FlatHunt AI</ion-label>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      @if (isAuth) {
        <ion-button routerLink="/listings" routerLinkActive="active" fill="clear">
          <mat-icon slot="icon-only" fontIcon="search"></mat-icon>
        </ion-button>
        <ion-button routerLink="/preferences" routerLinkActive="active" fill="clear">
          <mat-icon slot="icon-only" fontIcon="tune"></mat-icon>
        </ion-button>
        <ion-button routerLink="/favorites" routerLinkActive="active" fill="clear">
          <mat-icon slot="icon-only" fontIcon="favorite"></mat-icon>
        </ion-button>
        <ion-button routerLink="/history" routerLinkActive="active" fill="clear">
          <mat-icon slot="icon-only" fontIcon="history"></mat-icon>
        </ion-button>

        <ion-button (click)="signOut()" fill="clear">
          @if (userAvatar) {
            <img [src]="userAvatar" class="user-avatar" alt="avatar" />
          } @else {
            <span class="user-initials">{{ userName.charAt(0) }}</span>
          }
        </ion-button>
      } @else {
        <ion-button (click)="signIn()" fill="solid" color="primary">
          <mat-icon slot="start" fontIcon="login"></mat-icon>
          <ion-label>Iniciar sesión</ion-label>
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

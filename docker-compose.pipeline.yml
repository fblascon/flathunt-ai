version: '3.8'

services:
  pipeline:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    # Ejecutar cada 30 minutos
    command: >
      sh -c "while true; do python pipeline.py --pages 1 --detail-limit 50; sleep 1800; done"
